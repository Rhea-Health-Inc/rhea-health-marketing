name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static (SPA) snapshot for the Pages subpath
        env:
          RHEA_SPA: "1"
          RHEA_BASE: "/rhea-health-marketing/"
          VITE_APP_URL: "https://okhaibhor101chris.betadrop.site"
        run: npm run build
      - name: Prepare Pages artifact (SPA shell + route copies + 404 fallback)
        run: |
          cd .output/public
          cp _shell.html index.html
          rm _shell.html
          cp index.html 404.html
          for r in about pricing loop; do cp index.html "$r.html"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: deployment
        uses: actions/deploy-pages@v4
